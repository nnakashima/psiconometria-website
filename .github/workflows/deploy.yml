# Publica o site na Hostinger a cada push no main que mude static-site/.
# Envia por FTPS só os arquivos alterados (a Action guarda um registro de sincronização no servidor).
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER    IP ou host do FTP (hPanel → Arquivos → Contas FTP), ex.: 147.93.37.26
#   FTP_USERNAME  usuário da conta FTP de deploy (com diretório = public_html)
#   FTP_PASSWORD  senha dessa conta
name: Deploy na Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'static-site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::Secrets FTP_SERVER/FTP_USERNAME/FTP_PASSWORD ausentes; deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - name: Conferir o pacote
        if: steps.cfg.outputs.ok == 'true'
        run: |
          test -f static-site/index.html
          test -f static-site/en/index.html
          test ! -f static-site/api/config.php

      - name: Enviar por FTPS para public_html
        if: steps.cfg.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./static-site/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            README.md
            api/config.php
